[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "image-enhancement"
version = "1.2.0"
description = "NumPy-based image enhancement: spatial tone mapping, local contrast enhancement, color correction (white balance), saturation adjustment and exposure fusion"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Vasileios Vonikakis", email = "bbonik@gmail.com" },
]
requires-python = ">=3.9"
keywords = [
    "image-enhancement", "tone-mapping", "local-contrast", "white-balance",
    "exposure-fusion", "retinex", "hdr", "image-processing",
]
dependencies = [
    "numpy>=1.22",
    "scikit-image>=0.19",
    "imageio>=2.9",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
# verbose=True visualizations
plot = ["matplotlib>=3.5"]
# CUDA pipeline (cuda/image_enhancement_cuda.py); requires an NVIDIA GPU
# and a compiled .cubin, see README
cuda = ["pycuda", "Pillow"]
# numba-accelerated photometric mask (bit-exact, ~10x faster)
fast = ["numba>=0.59"]
# development: tests and lint
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/bbonik/image_enhancement"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "regression: full-pipeline comparison against golden references (slow)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
# Correctness-only rules: the legacy code base has an established style
# (spacing, long docstring lines) that we deliberately do not churn.
# E9 = syntax/runtime errors, F = pyflakes (undefined names, unused imports).
select = ["E9", "F"]
