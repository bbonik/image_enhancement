name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint (correctness rules only)
        run: ruff check src tests examples cuda

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit -q

  regression:
    # Compares pipeline outputs against the golden references captured in
    # tests/regression/references/references.npz. A small tolerance absorbs
    # legitimate cross-platform floating point differences (e.g. BLAS-backed
    # rgb2gray); real algorithm changes exceed it by orders of magnitude.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Compare against golden references
        env:
          REGRESSION_TOLERANCE: "1e-3"
        run: pytest -m regression -q -s
