name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint (correctness rules only)
        run: ruff check src tests examples cuda

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit -q

  regression:
    # Compares pipeline outputs against the golden references captured in
    # tests/regression/references/references.npz. The references were
    # captured on macOS; libm/BLAS last-ulp differences on Linux flip
    # isolated pixels across uint8/LUT quantization boundaries, so
    # cross-platform mode allows a small per-pixel tolerance, a tiny
    # fraction of outlier pixels, and a hard per-pixel cap. Real algorithm
    # changes move most pixels far beyond all three limits.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Compare against golden references
        env:
          REGRESSION_CROSS_PLATFORM: "1"
        run: pytest -m regression -q -s

  regression-numba:
    # Same golden-reference comparison, but with numba installed so the
    # compiled envelope kernel is exercised. The fast path must produce
    # results identical to the NumPy path.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev and fast extras
        run: pip install -e ".[dev,fast]"
      - name: Compare against golden references (numba path)
        env:
          REGRESSION_CROSS_PLATFORM: "1"
        run: pytest -m regression -q -s
